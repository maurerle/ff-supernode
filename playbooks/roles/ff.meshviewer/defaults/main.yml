---
yanic_url: "./data/"

# meshviewer is installed from the build artifact of an upstream release
# (https://github.com/freifunk/meshviewer/releases) instead of a git checkout
# that has to be built on the host, so no node/npm is needed here.
meshviewer_version: "v14.0.0"
meshviewer_release_url: "https://github.com/freifunk/meshviewer/releases/download/{{ meshviewer_version }}/meshviewer-build.zip"
# upstream publishes no checksums; this is the sha256 of the asset of
# meshviewer_version, so bump both together
meshviewer_checksum: "sha256:aaeac5d0389c2e89ef0c511fac79c5b8d5cebe4ff76547e11ef47a5680d7e15b"
meshviewer_download_dir: "/var/cache/meshviewer"
meshviewer_webroot: "/var/www/html/meshviewer"

device_pictures_source_dir: "/home/{{ ansible_user }}/device-pictures"
# served by the /pictures-svg location of ff.nginx from the converted pictures
device_pictures_url: "/pictures-svg/{MODEL_NORMALIZED}.svg"

# list of overlay layers, rendered to json (see README)
meshviewer_geo: []
# group_vars swaps the two texts in the template on purpose: the upstream EOL
# list holds the 4MB/32MB devices and the deprecation list the 8MB/64MB ones.
deprecation_enabled: false
deprecation_text: ""
eol_text: ""

# Client side charts read their values from Grafana's HTTP API instead of the
# image renderer (faster and sharper, less load on Grafana). ff.nginx proxies
# that API under /_grafana on the map host, so the requests stay same-origin and
# need neither CORS on Grafana nor a connect-src entry (see proxy.conf). Links
# into Grafana keep the absolute grafana_url.
meshviewer_grafana_browser_url: "/_grafana"
meshviewer_grafana_org_id: 1
# Entries are passed to the config as "nodeCharts"; the list for this site lives
# in group_vars. An empty list keeps only the rendered images.
meshviewer_grafana_charts: []
