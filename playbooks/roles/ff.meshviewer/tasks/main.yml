---
- name: Ensure unzip
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    state: present
    name: "unzip"

- name: Read the installed meshviewer version
  ansible.builtin.slurp:
    src: "{{ meshviewer_download_dir }}/installed-version"
  register: meshviewer_installed
  failed_when: false

- name: Install the meshviewer release {{ meshviewer_version }}
  when: >-
    meshviewer_installed.content is not defined
    or (meshviewer_installed.content | b64decode | trim) != meshviewer_version
  block:
    - name: Create meshviewer download directory
      ansible.builtin.file:
        state: directory
        dest: "{{ meshviewer_download_dir }}"
        mode: "0755"

    - name: Download meshviewer release {{ meshviewer_version }}
      ansible.builtin.get_url:
        url: "{{ meshviewer_release_url }}"
        dest: "{{ meshviewer_download_dir }}/meshviewer-{{ meshviewer_version }}.zip"
        checksum: "{{ meshviewer_checksum }}"
        mode: "0644"

    - name: Remove the hashed assets of the previous build
      ansible.builtin.file:
        path: "{{ meshviewer_webroot }}/assets"
        state: absent

    - name: Unpack the meshviewer release build
      ansible.builtin.unarchive:
        src: "{{ meshviewer_download_dir }}/meshviewer-{{ meshviewer_version }}.zip"
        dest: "{{ meshviewer_webroot }}"
        remote_src: true

    - name: Record the installed meshviewer version
      ansible.builtin.copy:
        content: "{{ meshviewer_version }}\n"
        dest: "{{ meshviewer_download_dir }}/installed-version"
        mode: "0644"

- name: "Copy meshviewer config"
  ansible.builtin.template:
    src: "meshviewer_config.json.j2"
    dest: "{{ meshviewer_webroot }}/config.json"
    owner: "www-data"
    group: "www-data"
    mode: "0644"
    # a config.json that does not parse leaves the map empty
    validate: python3 -m json.tool %s

- name: Deploy the map overlays
  ansible.builtin.copy:
    src: "geo/"
    dest: "{{ meshviewer_webroot }}/geo/"
    mode: "0644"

- name: Clone picture sources
  ansible.builtin.git:
    repo: https://github.com/freifunk/device-pictures
    dest: "{{ device_pictures_source_dir }}"
    version: "main"
    accept_hostkey: true
  register: device_pictures_clone

- name: "Convert device pictures"
  ansible.builtin.shell:
    cmd: ./conversion-script.sh && rm -rf /var/www/html/pictures-* && cp -rp pictures-* /var/www/html/
    chdir: "{{ device_pictures_source_dir }}"
  when: device_pictures_clone is changed
  changed_when: true

- name: Create data directory
  ansible.builtin.file:
    state: directory
    dest: "{{ meshviewer_webroot }}/data"
    owner: "yanic"
    group: "www-data"

- name: "Copy graveyard script"
  ansible.builtin.template:
    src: "update-graveyard.sh"
    dest: "/var/www/html/graveyard/update-graveyard.sh"
    owner: "www-data"
    group: "www-data"

# TODO as user ffac
- name: Setup cronjob for graveyard update
  ansible.builtin.cron:
    name: graveyard
    user: "ffac"
    job: "cd /home/ffac && ./update-graveyard.sh"
    minute: "0"
    hour: "5"

- name: Symlink meshviewer.json to graveyard.json
  ansible.builtin.file:
    src: /home/ffac/graveyard.json
    dest: /var/www/html/graveyard/meshviewer.json
    state: link
