---
- name: Remove other http server installs
  ansible.builtin.apt:
    name: apache2
    state: absent

- name: Ensure nginx
  ansible.builtin.apt:
    update_cache: true
    state: latest
    name: "{{ packages }}"
  vars:
    packages:
      - nginx-full
      #      - nginx-extras
      - ssl-cert

- name: Nginx config
  ansible.builtin.template:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf
  notify: Reload nginx

- name: Nginx sites config
  ansible.builtin.template:
    src: proxy.conf
    dest: /etc/nginx/sites-available/proxy.conf
  notify: Reload nginx

- name: Enable nginx sites config
  ansible.builtin.file:
    src: /etc/nginx/sites-available/proxy.conf
    dest: /etc/nginx/sites-enabled/proxy.conf
    state: link

- name: Delete default config
  ansible.builtin.file:
    state: absent
    path: "{{ item }}"
  loop:
    - /etc/nginx/sites-enabled/default
    - /etc/nginx/sites-available/default

- name: Create Selfsigned-certs
  become: true
  ansible.builtin.raw: make-ssl-cert generate-default-snakeoil # --force-overwrite

# a failing test stops the play before the reload, so the running server keeps
# its last good config
- name: Test nginx config
  ansible.builtin.command: nginx -t
  changed_when: false

# reload now, so the running server picks the config up even when a later role
# in the play fails before the handlers would run
- name: Flush handlers
  ansible.builtin.meta: flush_handlers
