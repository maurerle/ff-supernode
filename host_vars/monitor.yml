---
servername: monitor

# cloud-init config
networkd_interfaces:
  - name: ens18
    addresses:
      - 5.145.135.151/27
      - 2a00:fe0:43::201/64
    gateway4: 5.145.135.129
    gateway6: 2a00:fe0:43::1
    dns_server:
      - 9.9.9.9
      - '2a03:2260:3006::53'
dns_hostname: monitor.freifunk-aachen.de
dns_hostnames:
  - monitor.freifunk-aachen.de
  - wg-broker.freifunk-aachen.de
  - grafana.freifunk-aachen.de
  - devmap.freifunk-aachen.de
yanic_url: ./data/
yanic_webserver: "false"
yanic_central_server: "true"
yanic_influx_enabled: "true"

# segment boundaries drawn on the map: one layer, fetched from the webroot
# (ff.meshviewer deploys it from files/geo/, rounded to 4 decimals). Inline
# json is still supported, but this kept 160 kB in every config.json load.
meshviewer_geo:
  - url: /geo/segment03.geojson
    option:
      style:
        color: "#555555"
        weight: 5
        opacity: 0.4
        fillColor: "#555555"
        fillOpacity: 0.1
